name: Debug Prospector

on:
  workflow_dispatch

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: West Init
        run: |
          pip install west
          west init -l config
          west update

      - name: Search st7789
        run: |
          grep -Rni "st7789" . || true

      - name: List Prospector Files
        run: |
          find . -path "*prospector*" | sort || true
